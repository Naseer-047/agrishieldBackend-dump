<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriShield Farmer Portal</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        img { max-width: 100%; border-radius: 4px; margin-top: 10px; }
        button { background: #16a34a; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🌱 AgriShield Farmer Portal</h1>

    <div class="card">
        <h2>1. Disease Diagnosis</h2>
        <input type="file" id="leafImage" accept="image/*">
        <button onclick="analyzeLeaf()">Analyze Crop</button>

        <div id="results" style="display: none; margin-top: 20px;">
            <h3>Result: <span id="diseaseName"></span> (<span id="confidence"></span>%)</h3>
            <p>Grad-CAM Heatmap:</p>
            <img id="heatmapImage" alt="Disease Heatmap">
        </div>
    </div>

    <div class="card">
    <h2>2. Field Weather Conditions</h2>
    <button onclick="fetchWeather()">Get My Location & Weather</button>
    <div id="weatherResults" style="display: none; margin-top: 15px;">
        <p>🌡️ Temp: <span id="temp"></span>°C</p>
        <p>💧 Humidity: <span id="humidity"></span>%</p>
        <p>🌧️ Rain: <span id="rain"></span> mm</p>
    </div>
    </div>
    <div class="card">
        <h2>2. Safe Harvest Estimator (with Weather)</h2>
        <div style="display: flex; flex-direction: column; gap: 10px; max-width: 300px; margin-bottom: 15px;">
            <label>Crop: <input type="text" id="crop" placeholder="e.g., Tomato" value="Tomato"></label>
            <label>Pesticide: <input type="text" id="pesticide" placeholder="e.g., Lambda cyhalothrin" value="Lambda cyhalothrin"></label>
            <label>Spray Date: <input type="date" id="sprayDate"></label>
        </div>

        <button onclick="checkMRLRisk()">Calculate Risk & Fetch Weather</button>

        <div id="mrlResults" style="display: none; margin-top: 20px; padding: 15px; border-radius: 6px; background: #f8fafc;">
            <h3>Status: <span id="mrlStatus" style="font-weight: bold;"></span></h3>
            <p>⏳ Safe Harvest In: <strong id="countdown"></strong> days</p>
            <p>🧪 Estimated Residue: <span id="residue"></span> mg/kg (Limit: <span id="limit"></span>)</p>
            <p>🌤️ Weather Impact: <em id="weatherNote"></em></p>
        </div>
    </div>

    <script>
        // Set today's date as default for the spray date input to save time testing
        document.getElementById('sprayDate').valueAsDate = new Date();

        function checkMRLRisk() {
            const crop = document.getElementById('crop').value;
            const pesticide = document.getElementById('pesticide').value;
            const sprayDate = document.getElementById('sprayDate').value;

            if (!crop || !pesticide || !sprayDate) {
                alert("Please fill in crop, pesticide, and spray date.");
                return;
            }

            // Define the core payload
            const payload = {
                crop: crop,
                pesticide: pesticide,
                spray_date: sprayDate
            };

            // Attempt to get location for weather integration
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        payload.latitude = position.coords.latitude;
                        payload.longitude = position.coords.longitude;
                        sendMRLRequest(payload);
                    },
                    (error) => {
                        console.warn("Location denied or failed. Proceeding without weather data.");
                        sendMRLRequest(payload);
                    }
                );
            } else {
                sendMRLRequest(payload);
            }
        }

        async function sendMRLRequest(payload) {
            try {
                const response = await fetch('http://127.0.0.1:8000/mrl-risk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.status === "ERROR" || data.status === "HOLD") {
                    alert("Issue: " + data.explanation);
                    return;
                }

                // Update UI with results
                const statusSpan = document.getElementById('mrlStatus');
                statusSpan.innerText = data.status;
                statusSpan.style.color = data.status === "SAFE" ? "green" : "orange";

                document.getElementById('countdown').innerText = data.safe_harvest_countdown_days;
                document.getElementById('residue').innerText = data.estimated_residue_mg_kg;
                document.getElementById('limit').innerText = data.mrl_limit;
                document.getElementById('weatherNote').innerText = data.weather_adjustment;

                document.getElementById('mrlResults').style.display = 'block';
            } catch (error) {
                console.error("Connection failed:", error);
                alert("Failed to connect to the backend.");
            }
        }
    </script>
    
    <script>
        function fetchWeather() {
    if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser");
        return;
    }

    navigator.geolocation.getCurrentPosition(async (position) => {
        const payload = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude
        };

        try {
            const response = await fetch('http://127.0.0.1:8000/weather', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (data.status === "success") {
                document.getElementById('temp').innerText = data.temperature_c;
                document.getElementById('humidity').innerText = data.humidity_percent;
                document.getElementById('rain').innerText = data.precipitation_mm;
                document.getElementById('weatherResults').style.display = 'block';
            } else {
                alert("Error fetching weather: " + data.explanation);
            }
        } catch (error) {
            console.error("Connection failed:", error);
        }
    }, (error) => {
        alert("Please allow location access to get weather data.");
    });
}
        async function analyzeLeaf() {
            const fileInput = document.getElementById('leafImage');
            if (fileInput.files.length === 0) {
                alert('Please select an image first.');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                // Pointing to your PyCharm FastAPI server
                const response = await fetch('http://127.0.0.1:8000/diagnose', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Inject results into the HTML
                document.getElementById('diseaseName').innerText = data.disease;
                document.getElementById('confidence').innerText = data.confidence_percent;
                document.getElementById('heatmapImage').src = "data:image/jpeg;base64," + data.heatmap_base64;

                document.getElementById('results').style.display = 'block';
            } catch (error) {
                console.error("Error:", error);
                alert("Failed to connect to the backend. Is PyCharm running?");
            }
        }
        document.getElementById('sprayDate').valueAsDate = new Date();

        function checkMRLRisk() {
            const crop = document.getElementById('crop').value;
            const pesticide = document.getElementById('pesticide').value;
            const sprayDate = document.getElementById('sprayDate').value;

            if (!crop || !pesticide || !sprayDate) {
                alert("Please fill in crop, pesticide, and spray date.");
                return;
            }

            // Define the core payload
            const payload = {
                crop: crop,
                pesticide: pesticide,
                spray_date: sprayDate
            };

            // Attempt to get location for weather integration
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        payload.latitude = position.coords.latitude;
                        payload.longitude = position.coords.longitude;
                        sendMRLRequest(payload);
                    },
                    (error) => {
                        console.warn("Location denied or failed. Proceeding without weather data.");
                        sendMRLRequest(payload);
                    }
                );
            } else {
                sendMRLRequest(payload);
            }
        }

        async function sendMRLRequest(payload) {
            try {
                const response = await fetch('http://127.0.0.1:8000/mrl-risk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.status === "ERROR" || data.status === "HOLD") {
                    alert("Issue: " + data.explanation);
                    return;
                }

                // Update UI with results
                const statusSpan = document.getElementById('mrlStatus');
                statusSpan.innerText = data.status;
                statusSpan.style.color = data.status === "SAFE" ? "green" : "orange";

                document.getElementById('countdown').innerText = data.safe_harvest_countdown_days;
                document.getElementById('residue').innerText = data.estimated_residue_mg_kg;
                document.getElementById('limit').innerText = data.mrl_limit;
                document.getElementById('weatherNote').innerText = data.weather_adjustment;

                document.getElementById('mrlResults').style.display = 'block';
            } catch (error) {
                console.error("Connection failed:", error);
                alert("Failed to connect to the backend.");
            }
        }

    </script>
</body>
</html>
